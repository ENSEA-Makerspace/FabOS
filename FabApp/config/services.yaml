# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # ⚠️ `%kernel.secret%` is APP_SECRET. It keys the password-reset MAC, so
    # rotating it invalidates every outstanding reset link — which is the correct
    # behaviour and worth knowing before rotating it.
    App\Security\PasswordResetTokenizer:
        arguments:
            $secret: '%kernel.secret%'

    # S189 — même clé racine ; le jeton en DÉRIVE une propre à l'activation, donc
    # un lien de réinitialisation ne vaut jamais activation.
    App\Security\AccountVerificationTokenizer:
        arguments:
            $secret: '%kernel.secret%'

    # S191b — le secret TOTP est chiffré avec une clé dérivée d'APP_SECRET :
    # le faire tourner rend les seconds facteurs illisibles (réinitialisation admin).
    App\Security\MfaService:
        arguments:
            $secret: '%kernel.secret%'

    # Every translated string gets the installation's own words for %org% and
    # %venue%, so no call site has to remember to pass them. Decoration rather
    # than an event listener because the translator is used well outside the
    # request cycle too — the mail worker and the console both go through it.
    App\Service\VocabularyTranslator:
        decorates: translator
        arguments:
            $inner: '@.inner'

    # The five languages come from framework config, not from a list retyped in
    # each controller — see LocaleCatalog for the two that had drifted to two.
    App\Service\LocaleCatalog:
        arguments:
            $enabledLocales: '%kernel.enabled_locales%'

    # ⚠️ Le catalogue des gabarits d'e-mail LIT LES FICHIERS pour en déduire les
    # champs disponibles — une liste tenue à la main diverge du jour où quelqu'un
    # ajoute une variable, et l'éditeur continue de proposer l'ancienne. Il lui
    # faut donc le chemin des gabarits, qui n'est pas autowirable.
    App\Mail\MailTemplateCatalog:
        arguments:
            $templateDir: '%kernel.project_dir%/templates/emails'

    # ⚠️ La médiathèque d'identité écrit des fichiers : elle a besoin du dossier
    # de destination, qui n'est pas autowirable. Un seul endroit le nomme — deux
    # constantes du même chemin finissent par diverger, et la panne est un
    # fichier écrit là où personne ne le lit.
    App\Media\SiteMediaLibrary:
        arguments:
            $uploadDir: '%kernel.project_dir%/public/uploads/identity'

    # ⚠️ La sonde vérifie que le FICHIER est bien écrit puis effacé, pas seulement
    # la ligne en base : elle a donc besoin du même dossier, et de la même source.
    App\Command\S165MediaProbeCommand:
        arguments:
            $uploadDir: '%kernel.project_dir%/public/uploads/identity'

    # ⚠️ La sonde S168 compte les émissions de `rel="icon"` dans les SOURCES :
    # rendre les huit pages demanderait huit décors, dont un kiosque qui n'existe
    # que pour un lieu donné. Il lui faut donc le dossier des gabarits.
    App\Command\S168FaviconProbeCommand:
        arguments:
            $templateDir: '%kernel.project_dir%/templates'

    # ⚠️ La sonde des préréglages LIT `style.css` pour vérifier que le palier
    # mobile qu'elle protège existe vraiment — sans quoi la précaution serait du
    # bruit. Elle a donc besoin du dossier du projet et de celui des images.
    App\Command\S166PresetsProbeCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $uploadDir: '%kernel.project_dir%/public/uploads/identity'

    # Serves the repo's own docs/*.md; needs the project dir, not autowirable.
    App\Service\MarkdownDocService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Measures event artwork on disk to decide poster vs banner; same reason.
    App\Event\EventArtwork:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Deletes the avatar and banner files off disk when an account is erased.
    # ⚠️ Unlinking the row is not erasure — the face stays in public/uploads.
    App\Account\AccountAnonymiser:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

