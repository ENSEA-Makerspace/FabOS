framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # ⚠️ Un worker arrêté pendant un envoi (cache:clear d'un déploiement,
                # redémarrage) laisse son message « pris » ; Doctrine ne le rend
                # qu'après ce délai — 1 h par défaut, soit un lien de confirmation
                # d'adresse en retard d'une heure (vécu le 2026-09-27). Un envoi
                # dure quelques secondes : 5 min ne peut pas créer de doublon.
                options:
                    redeliver_timeout: 300
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            App\Mail\Message\SendMailMessage: async
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
