security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # ⚠️ TEMPORARY: password-less admin sign-in, and it stays inert unless
            # LOCAL_ADMIN_BYPASS=1 *and* the request is from loopback *and* debug
            # is on. Remove this line and the class when the admin templates are done.
            custom_authenticators:
                - App\Security\LocalAdminAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_profile
            logout:
                path: app_logout
                target: app_home

    access_control:
        - { path: ^/api/reservations$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/api/reservations/\d+/cancel$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/api/progressions$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/api/formations/\d+/suivi$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/profil, roles: ROLE_USER }
        # Staff desk tools (issuing access passes). Staff OR admin — the point of
        # the split is that this must not require ROLE_ADMIN. Trainers excluded.
        - { path: ^/staff, roles: [ROLE_STAFF, ROLE_ADMIN] }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
