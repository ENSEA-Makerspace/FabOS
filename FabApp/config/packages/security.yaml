security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # 🔴 **Un compte « inactif » ne se connectait pas moins qu'un autre**
            # avant le 2026-09-05 : rien ne lisait `statut` à la connexion. Le
            # mot promettait une coupure que le produit n'appliquait pas.
            # ⚠️ Le refus va vers le FERMÉ : tout statut différent de `actif` est
            # refusé, y compris une valeur inconnue.
            user_checker: App\Security\ActiveAccountChecker
            # Signs in the request `app:render` makes to itself, so admin screens
            # can be inspected from a shell. It cannot be armed by a request — see
            # ConsoleRenderAuthenticator. It replaced LOCAL_ADMIN_BYPASS, which
            # could be, and which was reachable over HTTP.
            custom_authenticators:
                - App\Security\ConsoleRenderAuthenticator
            # 🔴 S196a — une limite aux essais de mot de passe. Il n'y en avait
            # AUCUNE : n'importe quel compte se devinait à la vitesse du serveur,
            # et un module d'annuaire (Phase U) aurait fait de FabOS un relais
            # pour deviner les mots de passe de l'établissement.
            # 5 ÉCHECS par (identifiant, IP) et 25 par IP toutes les 5 minutes.
            # Seuls les échecs comptent (Symfony 8 regarde le compteur sans le
            # consommer, et ne décompte qu'une connexion ratée — mesuré par la
            # sonde) : une salle de classe derrière une seule IP qui se connecte
            # ne consomme rien. ⚠️ Une réussite ne remet PAS le compteur à zéro.
            # ⚠️ Le proxy NPM est déclaré de confiance
            # (`framework.trusted_proxies`) : sans lui, TOUS les visiteurs
            # partageraient une IP et 25 fautes fermeraient le site à tout le monde.
            # Le refus tombe avant la vérification du mot de passe et vaut pour
            # une adresse inconnue comme pour un membre : il ne révèle rien.
            login_throttling:
                max_attempts: 5
                interval: '5 minutes'
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # ⚠️ **S147, J-17 — `use_referer`, and it is one line for the whole
                # site.** Every "sign in to do this" link on FabOS pointed at a bare
                # `/login`, so a visitor who clicked one from a machine, a space, an
                # event or a training page was dropped on their profile afterwards
                # and had to find their way back. Symfony already remembers where
                # they came from; nothing needed a `?redirect=` parameter of its own.
                # `default_target_path` stays as the fallback for a direct visit.
                use_referer: true
                default_target_path: app_profile
            logout:
                path: app_logout
                target: app_home

    access_control:
        - { path: ^/api/reservations$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/api/reservations/\d+/cancel$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/api/progressions$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/api/formations/\d+/suivi$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/profil, roles: ROLE_USER }
        # Staff desk tools (issuing access passes). Staff OR admin — the point of
        # the split is that this must not require ROLE_ADMIN. Trainers excluded.
        - { path: ^/staff, roles: [ROLE_STAFF, ROLE_ADMIN] }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
