security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Signs in the request `app:render` makes to itself, so admin screens
            # can be inspected from a shell. It cannot be armed by a request — see
            # ConsoleRenderAuthenticator. It replaced LOCAL_ADMIN_BYPASS, which
            # could be, and which was reachable over HTTP.
            custom_authenticators:
                - App\Security\ConsoleRenderAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_profile
            logout:
                path: app_logout
                target: app_home

    access_control:
        - { path: ^/api/reservations$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/api/reservations/\d+/cancel$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/api/progressions$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/api/formations/\d+/suivi$, roles: ROLE_USER, methods: [POST] }
        - { path: ^/profil, roles: ROLE_USER }
        # Staff desk tools (issuing access passes). Staff OR admin — the point of
        # the split is that this must not require ROLE_ADMIN. Trainers excluded.
        - { path: ^/staff, roles: [ROLE_STAFF, ROLE_ADMIN] }
        - { path: ^/admin, roles: ROLE_ADMIN }
        # S58/S59 proposal prototype. Admin-only: it renders unapproved page
        # shapes against real data, and an unapproved preview readable by
        # members is a promise the app has not made.
        # ⚠️ Delete this line with src/Controller/PropositionController.php,
        # templates/site/proposition/ and public/css/proposal.css.
        - { path: ^/proposition, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
