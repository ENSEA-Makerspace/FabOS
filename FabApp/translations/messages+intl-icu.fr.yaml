
#
# 🔴 **U_ARGUMENT_TYPE_MISMATCH — et c'est un 500, pas un repli.** ICU refuse
# qu'un MÊME argument serve à la fois de trou nu `{x}` et de sélecteur
# `{x, plural, …}` : ce sont deux types. Écrit une fois, ça a fait tomber
# `/admin/emails` et `/formations/{id}/suivi` en erreur 500 — pas en texte moche.
#   🔴  {count} sur {total} {count, plural, one {rappel} other {rappels}}
#   ✅  {count, plural, one {# rappel} other {# rappels}} sur {total}
# Le nombre repasse DANS la branche, avec `#`. Un autre argument peut, lui,
# apparaître à l'intérieur d'une branche : `one {# sur {total} place}` est valide.
#
# ⚠️ **Aucun lint ne voit ça** : `lint:yaml` est vert, `lint:twig` est vert. Il faut
# soit rendre la page, soit passer le validateur statique écrit en S148 (il rejoue
# les deux motifs fautifs comme cas de test).
#
# ⚠️ Apostrophes TYPOGRAPHIQUES (’) dans ces motifs : en ICU, `'` ouvre une citation
# devant `{`, `}` ou `#`, et mange le reste du texte sans rien signaler.

