# validators.en.yaml — les messages de contrainte (S147, J-24)
#
# 🔴 **Pourquoi la clé est une phrase française.** Les `FormType` passent leurs
# messages en dur : `new Assert\NotBlank(message: 'Le nom est obligatoire.')`.
# Symfony traduit un message de contrainte via le domaine `validators` en
# prenant le message LUI-MÊME comme clé — c'est la forme de migration
# documentée, et c'est ainsi que `debug:translation` les listait déjà comme
# « manquantes ». Aucun PHP n'a eu besoin de changer.
#
# ⚠️ **La clé doit être le message au caractère près**, apostrophes typographiques
# comprises (`L’email`, pas `L'email`) : une clé qui diffère d'un signe ne
# correspond pas et la phrase française traverse en l'état.
# ⚠️ Les `{{ limit }}` et `{{ min }}` sont remplis par le validateur : les garder
# tels quels, dans chaque langue.
# 🅿️ L'étape suivante — remplacer les littéraux par de vraies clés dans les 49
# contraintes — est un travail de PHP, pas de traduction, et il peut se faire
# écran par écran sans casser ce fichier.

